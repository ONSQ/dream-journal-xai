kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = ["bash", "-c", "pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/vigilant-spirit run build && pnpm --filter @workspace/xai-explorer run build"]
run = ["node", "artifacts/api-server/dist/index.cjs"]

[services.production.health.startup]
path = "/api/healthz"
