kind = "web"
previewPath = "/"
title = "Vigilant Spirit Dream Journal"
version = "1.0.0"
id = "artifacts/vigilant-spirit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25441
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/vigilant-spirit run dev"

[services.env]
PORT = "25441"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/vigilant-spirit", "run", "build"]
publicDir = "artifacts/vigilant-spirit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
