openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Vigilant Spirit Dream Journal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: classify
    description: Dream classification
  - name: entries
    description: Journal entry persistence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: modelHealth
      tags: [health]
      summary: Model health check
      responses:
        "200":
          description: Model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelHealthStatus"
  /classify:
    post:
      operationId: classifyDream
      tags: [classify]
      summary: Classify a dream
      description: Classifies dream text into Spiritual, Trauma, and Maintenance dimensions with SHAP, LIME, confidence intervals, and counterfactual explanations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
      responses:
        "200":
          description: Classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List all journal entries
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
                required:
                  - entries
    post:
      operationId: upsertEntry
      tags: [entries]
      summary: Create or update a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEntryRequest"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
  /entries/{clientId}:
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete a journal entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ModelHealthStatus:
      type: object
      properties:
        status:
          type: string
        model_loaded:
          type: boolean
        shap_available:
          type: boolean
        lime_available:
          type: boolean
        features:
          type: integer
      required: [status, model_loaded, shap_available, lime_available, features]
    DreamFields:
      type: object
      description: Individual dream entry fields for per-field weighted classification
      properties:
        narrative:
          type: string
        title:
          type: string
        theme:
          type: string
        affect:
          type: string
        interpretation:
          type: string
        coreThreat:
          type: string
        masteryAction:
          type: string
        safeEnding:
          type: string
        question:
          type: string
        incubationRequest:
          type: string
        concerns:
          type: string
    ClassifyRequest:
      type: object
      properties:
        text:
          type: string
          description: Plain concatenated text (used when fields not provided)
        fields:
          $ref: "#/components/schemas/DreamFields"
          description: Individual entry fields for per-field weighted classification (preferred)
      description: Either text or fields must be provided
    FeatureWeight:
      type: object
      properties:
        word:
          type: string
        weight:
          type: number
      required: [word, weight]
    DimensionFeatures:
      type: object
      properties:
        Spiritual:
          type: array
          items:
            $ref: "#/components/schemas/FeatureWeight"
        Trauma:
          type: array
          items:
            $ref: "#/components/schemas/FeatureWeight"
        Maintenance:
          type: array
          items:
            $ref: "#/components/schemas/FeatureWeight"
      required: [Spiritual, Trauma, Maintenance]
    DimensionProbabilities:
      type: object
      properties:
        Spiritual:
          type: number
        Trauma:
          type: number
        Maintenance:
          type: number
      required: [Spiritual, Trauma, Maintenance]
    DimensionAgreement:
      type: object
      properties:
        Spiritual:
          type: number
        Trauma:
          type: number
        Maintenance:
          type: number
      required: [Spiritual, Trauma, Maintenance]
    DimensionInterpretations:
      type: object
      properties:
        Spiritual:
          type: string
        Trauma:
          type: string
        Maintenance:
          type: string
      required: [Spiritual, Trauma, Maintenance]
    ConfidenceInterval:
      type: object
      description: Lower and upper bounds for a probability estimate
      properties:
        lower:
          type: number
        upper:
          type: number
        adequate:
          type: boolean
          description: Whether word count is sufficient for reliable classification
      required: [lower, upper, adequate]
    DimensionConfidenceIntervals:
      type: object
      properties:
        Spiritual:
          $ref: "#/components/schemas/ConfidenceInterval"
        Trauma:
          $ref: "#/components/schemas/ConfidenceInterval"
        Maintenance:
          $ref: "#/components/schemas/ConfidenceInterval"
      required: [Spiritual, Trauma, Maintenance]
    Counterfactual:
      type: object
      description: What the probability would be if a keyword were removed
      properties:
        remove:
          type: string
          description: The word whose removal is being simulated
        newProbability:
          type: number
          description: The probability if this word were removed
        delta:
          type: number
          description: Change in probability (negative means removing this word hurts the score)
        explanation:
          type: string
          description: Human-readable explanation of the counterfactual
      required: [remove, newProbability, delta, explanation]
    DimensionCounterfactuals:
      type: object
      properties:
        Spiritual:
          type: array
          items:
            $ref: "#/components/schemas/Counterfactual"
        Trauma:
          type: array
          items:
            $ref: "#/components/schemas/Counterfactual"
        Maintenance:
          type: array
          items:
            $ref: "#/components/schemas/Counterfactual"
      required: [Spiritual, Trauma, Maintenance]
    SourceInfo:
      type: object
      properties:
        title:
          type: string
        icon:
          type: string
        color:
          type: string
        guidance:
          type: string
      required: [title, icon, color, guidance]
    ClassifyResponse:
      type: object
      properties:
        success:
          type: boolean
        probabilities:
          $ref: "#/components/schemas/DimensionProbabilities"
        shap:
          $ref: "#/components/schemas/DimensionFeatures"
        lime:
          $ref: "#/components/schemas/DimensionFeatures"
        agreement:
          $ref: "#/components/schemas/DimensionAgreement"
        confidenceIntervals:
          $ref: "#/components/schemas/DimensionConfidenceIntervals"
        counterfactuals:
          $ref: "#/components/schemas/DimensionCounterfactuals"
        sourceType:
          type: string
        sourceInfo:
          $ref: "#/components/schemas/SourceInfo"
        interpretation:
          type: string
        dimensionInterpretations:
          $ref: "#/components/schemas/DimensionInterpretations"
        wordCount:
          type: integer
        negationsDetected:
          type: integer
          description: Number of keywords neutralized due to negation context
        fieldWeighting:
          type: boolean
          description: Whether per-field weighting was applied
      required:
        - success
        - probabilities
        - shap
        - lime
        - agreement
        - confidenceIntervals
        - counterfactuals
        - sourceType
        - sourceInfo
        - interpretation
        - dimensionInterpretations
        - wordCount
        - negationsDetected
        - fieldWeighting
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
      required: [success, error]
    JournalEntry:
      type: object
      properties:
        clientId:
          type: string
        mode:
          type: string
          enum: [vigilant, restored]
        phase:
          type: string
        entryDate:
          type: string
        data:
          type: object
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [clientId, mode, phase, entryDate, data, createdAt, updatedAt]
    UpsertEntryRequest:
      type: object
      properties:
        clientId:
          type: string
        mode:
          type: string
          enum: [vigilant, restored]
        phase:
          type: string
        entryDate:
          type: string
        data:
          type: object
      required: [clientId, mode, phase, entryDate, data]
